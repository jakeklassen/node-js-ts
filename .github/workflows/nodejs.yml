name: Node.js CI

on: [push]

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # Installs the node and pnpm versions pinned in mise.toml, so CI and local
      # development cannot drift apart.
      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test
